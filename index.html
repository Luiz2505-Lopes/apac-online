<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Gerador APAC Online</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<h1>APAC - Autorização de Procedimentos Ambulatoriais</h1>

<div class="form">
<input id="estabelecimento" placeholder="NOME DO ESTABELECIMENTO DE SAÚDE SOLICITANTE">
<input id="cnes" placeholder="CNES">

<h3>IDENTIFICAÇÃO DO PACIENTE</h3>
<input id="paciente" placeholder="NOME DO PACIENTE">
<input id="cpf" placeholder="CPF OU CARTÃO NACIONAL DE SAÚDE (CNS)">
<input id="mae" placeholder="NOME DA MÃE">
<input id="nascimento" placeholder="DATA DE NASCIMENTO">
<input id="sexo" placeholder="SEXO">
<input id="municipio" placeholder="MUNICÍPIO DE RESIDÊNCIA">

<h3>PROCEDIMENTO SOLICITADO</h3>
<input id="codigo" placeholder="CÓDIGO DO PROCEDIMENTO PRINCIPAL">
<input id="procedimento" placeholder="NOME DO PROCEDIMENTO PRINCIPAL">

<h3>DADOS DO DIAGNÓSTICO</h3>
<input id="cid" placeholder="CID 10">
<textarea id="justificativa" placeholder="JUSTIFICATIVA DO(S) PROCEDIMENTO(S) SOLICITADO(S)"></textarea>

<h3>SOLICITAÇÃO</h3>
<input id="solicitante" placeholder="NOME DO PROFISSIONAL SOLICITANTE">

<button onclick="gerar()">GERAR PDF APAC</button>
</div>

<script src="script.js"></script>
</body>
</html>
